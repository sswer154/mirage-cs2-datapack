plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = '0.1.2'
group = 'com.sandrone.cs2footsteps'

base {
    archivesName = 'cs2footsteps'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

minecraft {
    accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
}

runs {
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'cs2shop'
    }
}

repositories {
    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com'
    }
    mavenCentral()
    maven {
        name = 'Aliyun'
        url = 'https://maven.aliyun.com/repository/public'
    }
}

dependencies {
    compileOnly files("../../模组/mods/客户端模组/cs2fairplay-0.1.4.jar")
    implementation "net.neoforged:neoforge:21.1.250"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
